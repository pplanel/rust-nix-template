{{% raw %}}
name: CI & Release

on:
  pull_request:
  push:
    branches:
      - main

# Prevent concurrent releases from racing on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Nix Flake Check (${{ matrix.os }})
    # Skip CI if the head commit is an automated version bump
    if: "!startsWith(github.event.head_commit.message, 'chore(version):')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags are mandatory for cog and git-cliff
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Verify Conventional Commits
        # On PRs, lint from the latest tag to the PR HEAD
        run: |
          nix develop --command cog check --from-latest-tag

      - name: Run Nix Flake Checks (Clippy, Nextest, Fmt, Hakari, Build)
        run: |
          nix flake check -L

  release:
    name: Semantic Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(version):')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a GitHub App token or PAT here if `main` has branch protection enabled
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Git identity for Cocogitto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate and Execute Semantic Bump
        id: bump
        run: |
          # Dry-run first so commits like `chore:` or `ci:` exit cleanly without failing CI
          VERSION=$(nix develop --command cog bump --auto --dry-run 2>/dev/null || true)

          if [ -z "$VERSION" ]; then
            echo "No releasable commits found since latest tag. Skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Bumping workspace to v$VERSION..."
          nix develop --command cog bump --auto

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release Binary & Create GitHub Release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Build the default package from the freshly bumped commit
          nix build .#default -L
{{ endraw }}
          # Package the compiled binary into a release archive
          tar -czvf "my-cli-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C result/bin .

          # Extract only the latest version's markdown notes via git-cliff
          nix develop --command git cliff --latest --strip all > RELEASE_NOTES.md

          # Create the GitHub Release and attach the binary archive
          gh release create "v${VERSION}" \
            "my-cli-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
{{% raw %}}
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md
{{% endraw %}}
