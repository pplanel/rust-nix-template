[changelog]
{% raw %}
header = """
# Changelog\n
All notable changes to this workspace will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}))\
    {% endfor %}
\n
"""
footer = ""
{% endraw %}
trim = true

# Tera macro for commit links — update with your repository URL
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/{{github_name}}/{{project}}" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
  # Automatically link PR/Issue numbers (#123) to GitHub
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^sec", group = "<!-- 5 -->Security" },
  # Skip release commits, dependency bumps, and hakari syncs
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(version\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(hakari\\)", skip = true },
  { message = "^chore|^ci|^test|^build", skip = true },
]
