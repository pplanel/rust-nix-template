# cargo-generate configuration.
[template]
cargo_generate_version = ">=0.21.0"
description = "Rust workspace boilerplate: crane flake, hakari, conventional releases."
ignore = [".git", "target", "result", "CHANGELOG.md", "CONVENTIONS.md"]

exclude = [
    "Cargo.toml",
    "flake.nix",
    "Justfile",
    "cog.toml",
    "cliff.toml",
    ".config/hakari.toml",
    ".github/workflows/ci.yml",
]

[hooks]
post = ["post-generate.rhai"]

[placeholders.github_owner]
type = "string"
prompt = "Github Organization or Username:"
default = "my-org"

[placeholders.cli_bin_name]
type = "string"
prompt = "Name of the primary CLI binary crate:"
default = "app-cli"
regex = "^[a-z][a-z0-9_-]*$"
