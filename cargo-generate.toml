# cargo-generate configuration.
#
# Scaffold a new project from this template with:
#     cargo generate --git <this-repo-url>
#
# cargo-generate renders files through the Liquid engine, which uses the same
# `{{ ... }}` / `{% ... %}` delimiters as several files this repo carries:
#   - Justfile            just's own `{{ param }}` recipe interpolation
#   - cliff.toml          git-cliff / Tera changelog templates
#   - cog.toml            cocogitto config and its changelog template
#   - .github/**          GitHub Actions `${{ ... }}` expressions
#
# Those are listed in `exclude` so they are copied verbatim instead of being
# mangled (or failing to parse) as Liquid. Add any new file that contains literal
# `{{ }}` to this list.

[template]
cargo_generate_version = ">=0.18.0"
description = "Rust workspace boilerplate: crane flake, hakari, conventional releases."

exclude = [
    "Justfile",
    "cliff.toml",
    "cog.toml",
    ".github/**",
    # Generated by cargo-hakari; never templated.
    "crates/my-workspace-hack/**",
]

# Prompts shown when generating a project. Only wire a placeholder here once a
# file actually references it (e.g. `{{ project_description }}` in a rendered
# file), otherwise generation prompts for a value that goes nowhere.
#
# [placeholders]
# project_description = { type = "string", prompt = "Project description", default = "A Rust service." }
