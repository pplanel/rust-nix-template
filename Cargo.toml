[workspace]
members = ["crates/*"]
resolver = "3"

# Names the workspace for crane (nix). Without it crane can't find a `name` in
# the root Cargo.toml (a pure workspace has no [package]) and warns per build.
[workspace.metadata.crane]
name = "rust-boilerplate"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.lints.clippy]
dbg_macro = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
as_conversions = "warn"
wildcard_dependencies = "warn"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
expect_used = "warn"

# Shared config for cargo-release across the monorepo
[workspace.metadata.release]
shared-version = true
{% raw %}tag-name = "v{{version}}"{% endraw %}
publish = false           # Flip to true in crates you distribute to crates.io

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
my-workspace-hack = { path = "crates/my-workspace-hack" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unused_qualifications = "warn"
